[package]
name = "transit"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Time-dependent transit analysis and optimization over a DAG of nodes with opening hours and coordinates."
license = "MIT"
keywords = ["graph", "dag", "transit", "shortest-path", "dijkstra"]
categories = ["algorithms", "data-structures"]
publish = false

[lib]
name = "transit"
path = "src/lib.rs"

[[bin]]
name = "transit-server"
path = "src/main.rs"

# The analysis library itself uses only std; these are for the HTTP server binary.
[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "transit_tests"
path = "tests/transit_tests.rs"

[profile.dev]
opt-level = 0

# The property tests run many Dijkstra passes; optimizing them keeps `cargo test` fast.
[profile.test]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1