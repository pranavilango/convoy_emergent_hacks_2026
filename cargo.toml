[package]
name = "medroute"
version = "0.1.0"
edition = "2021"
description = "Solar-power allocator for medicine delivery networks in electricity-insecure regions"
license = "MIT"

[lib]
name = "medroute"
path = "src/lib.rs"

[[bin]]
name = "medroute"
path = "src/main.rs"

[[test]]
name = "tests"
path = "tests/tests.rs"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "json", "multipart", "query", "tokio"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[profile.release]
lto = true
codegen-units = 1