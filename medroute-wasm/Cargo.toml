[package]
name = "medroute-wasm"
version = "0.1.0"
edition = "2021"
description = "The medroute allocator compiled to WebAssembly for the Convoy web app"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
medroute = { path = "..", default-features = false }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
